<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="tools-option">
        <div class="toolbar" role="toolbar">
            <button type="button" id="draw">D</button>
            <button type="button" id="erase">E</button>
            <input type="range" id="sizeBtn" min="1" max="50" value="5">
            <input type="color" id="colorPicker">
            <button type="button" id="undo">↺</button>
            <button type="button" id="clean">C</button>
            <button type="button" id="stamp">★</button>
        </div>
    </header>
    <canvas id="canvas" width="1000" height="600"></canvas>
    <script src="script.js"></script>
</body>
</html>
